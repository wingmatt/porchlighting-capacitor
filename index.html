<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="dns-prefetch" href="https://assets.porchlighting.net" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porchlighting</title>
    <script>
      (() => {
        const viewport = document.querySelector('meta[name="viewport"]');
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent)
          || /iPad|iPhone|iPod/.test(navigator.platform)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIos && viewport) {
          const baseViewport = viewport.getAttribute('content') || '';
          const setInputScale = (enabled) => {
            viewport.setAttribute(
              'content',
              enabled && !/maximum-scale=/i.test(baseViewport)
                ? `${baseViewport}, maximum-scale=1`
                : baseViewport,
            );
          };

          const isTextField = (target) => target instanceof HTMLElement
            && target.matches('input, textarea, select, ion-input');
          setInputScale(true);
          document.addEventListener('focusin', (event) => {
            if (isTextField(event.target)) setInputScale(true);
          });
          document.addEventListener('focusout', (event) => {
            if (isTextField(event.target) && !event.relatedTarget) setInputScale(false);
          });
        }
        const preference = localStorage.getItem('theme_preference');
        const dark = preference === 'dark' || (preference === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
